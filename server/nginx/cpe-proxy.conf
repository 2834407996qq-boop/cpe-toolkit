# ============================================================
# LuCI 后台反向代理  —— 放到 /etc/nginx/snippets/，在主站点 server{} 内 include
#
# 把 https://your.domain.com/cpe/ 映射到经 SSH 反向隧道可达的 CPE LuCI。
#
# 三个必须注意的点（都踩过坑）：
#   1) 所有 location 必须用 ^~ 前缀。否则会被 WordPress 之类的
#      `location ~* \.(css|js|png...)$` 正则规则抢走 → 静态资源 404。
#   2) LuCI 用绝对路径（/luci-static/、/cgi-bin/luci/），在子路径下会 404，
#      必须用 sub_filter 重写；同时保留根级兜底 location。
#   3) LuCI 下发的 session cookie path 是 /cgi-bin/luci/，与 /cpe/ 前缀不匹配
#      → 浏览器不发 cookie → 每点一个菜单就要求重新登录。
#      必须用 proxy_cookie_path 重写。
# ============================================================

location = /cpe {
    return 301 /cpe/;
}

# --- LuCI 静态资源 ---
location ^~ /cpe/luci-static/ {
    auth_basic "CPE Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_cpe;
    proxy_pass http://127.0.0.1:18111/luci-static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 1h;
}

# --- LuCI API ---
location ^~ /cpe/cgi-bin/luci/ {
    auth_basic "CPE Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_cpe;
    proxy_pass http://127.0.0.1:18111/cgi-bin/luci/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_cookie_path /cgi-bin/luci/ /;
    proxy_redirect ~^/(.*)$ /cpe/$1;
    proxy_set_header Accept-Encoding "";
    sub_filter '/luci-static/' '/cpe/luci-static/';
    sub_filter '/cgi-bin/luci/' '/cpe/cgi-bin/luci/';
    sub_filter_once off;
}

# --- LuCI 主入口 ---
location ^~ /cpe/ {
    auth_basic "CPE Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_cpe;
    proxy_pass http://127.0.0.1:18111/cgi-bin/luci/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_cookie_path /cgi-bin/luci/ /;
    proxy_redirect ~^/(.*)$ /cpe/$1;
    proxy_set_header Accept-Encoding "";
    sub_filter '/luci-static/' '/cpe/luci-static/';
    sub_filter '/cgi-bin/luci/' '/cpe/cgi-bin/luci/';
    sub_filter_once off;
}

# --- 兜底：LuCI 页面里的绝对路径直接访问 ---
location ^~ /luci-static/ {
    auth_basic "CPE Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_cpe;
    proxy_pass http://127.0.0.1:18111/luci-static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 1h;
}

location ^~ /cgi-bin/luci/ {
    auth_basic "CPE Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_cpe;
    proxy_pass http://127.0.0.1:18111/cgi-bin/luci/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_cookie_path /cgi-bin/luci/ /;
    proxy_redirect ~^/(.*)$ /cpe/$1;
    proxy_set_header Accept-Encoding "";
    sub_filter '/luci-static/' '/cpe/luci-static/';
    sub_filter '/cgi-bin/luci/' '/cpe/cgi-bin/luci/';
    sub_filter_once off;
}
