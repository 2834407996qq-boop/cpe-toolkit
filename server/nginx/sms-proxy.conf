# ============================================================
# 短信网关反向代理  —— 放到 /etc/nginx/snippets/，在主站点 server{} 内 include
#
#   https://your.domain.com/text   → 短信 Web 界面（需登录）
#   https://your.domain.com/api/*  → 其余接口（需登录）
#   https://your.domain.com/api/sms → CPE 上报入口（只用 token 鉴权，不加 Basic Auth）
#
# 注意：/api/sms 必须放在 ^~ /api/ 之前（nginx 精确匹配 = 优先于前缀匹配），
#       否则 CPE 上报时会被 Basic Auth 拦掉。
# ============================================================

location = /api/sms {
    proxy_pass http://127.0.0.1:18999/api/sms;
    proxy_set_header Host $host;
}

location ^~ /api/ {
    auth_basic "CPE Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_cpe;
    proxy_pass http://127.0.0.1:18999;
    proxy_set_header Host $host;
    # 发送短信最坏约 80s（CPE 串口等锁 + 重试），默认 60s 会误报失败
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location ^~ /text {
    auth_basic "CPE Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_cpe;
    proxy_pass http://127.0.0.1:18999;
    proxy_set_header Host $host;
}
